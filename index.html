<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge-1 Simple Landing Page with Html and CSS</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="container header-sec">
            <div id="mainLogo">
                <a href="/"><img src="./img/main-logo.png" alt="Corgi Coffeelatte"></a>
            </div>
            
            <nav class="top-nav">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Calendar</a></li>
                    <li><a href="#">Blog</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container hero">

            <!-- Left Hero -->
            <div class="hero-top animate-up">
                <h1>Your Pet Deserves the Best Care</h1>
                <p>
                    Professional grooming, pet hotel, and daily care to keep your furry friend happy and healthy.
                </p>

                <div class="hero-cta">
                    <a href="#" class="btn btn-primary">Learn More</a>
                </div>
            </div>

            <!-- Right Hero -->
            <div class="hero-bottom animate-up delay">

                <!-- Image Hero -->
                <div class="main-image">
                    <img src="./img/ginger.png" alt="Hazelnut">
                </div>

            </div>

            <!-- Thumbnails -->
            <!-- <div class="thumbnails">
                <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b">
                <img src="https://images.unsplash.com/photo-1558788353-f76d92427f16">
                <img src="https://images.unsplash.com/photo-1561037404-61cd46aa615b">
            </div> -->

        </div>
    </main>

    <footer>
        <div class="container footer-sec">© 2026 Corgi Coffeelatte. All Rights Reserved.</div>
    </footer>
    

</body>
</html>
